[workspace]
members = ["openbim-okstra"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later OR LicenseRef-Commercial"
authors = ["openbimrs contributors"]
repository = "https://github.com/openbimrs/okstra"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
